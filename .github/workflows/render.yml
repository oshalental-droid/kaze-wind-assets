name: Render wind research carousel

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/kazeo.png'
      - 'posts/episode-*.json'
      - 'render.py'
      - '.github/workflows/render.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Render images (when a source mascot is available)
        run: python render.py
      - name: Commit generated images only
        run: |
          if [ ! -d outputs ]; then
            echo "No generated images yet; add assets/kazeo.png"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/
          if git diff --cached --quiet; then
            echo "No output changes."
          else
            git commit -m "Render updated wind research post images"
            git push
          fi
